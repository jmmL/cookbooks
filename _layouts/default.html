<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

  <!-- Fonts with font-display: swap for better loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Skip link for keyboard navigation -->
  <a href="#recipe-list" class="skip-link">Skip to recipes</a>

  {{ content }}

  <!-- Scripts -->
  <script>
    // Inject data from Jekyll into JavaScript
    window.RECIPE_DATA = {
      books: {{ site.data.books | jsonify }},
      recipes: {{ site.data.recipes | jsonify }}
    };
  </script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
